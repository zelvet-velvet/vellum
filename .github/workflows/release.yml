# A pushed version tag (bare, like 0.8.3): build from that commit, attest the files, and leave a draft release with them.
# /cmd-release then adds the notes and publishes the draft.
name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store it
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - name: Tag matches manifest.json
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, manifest.json $v"; exit 1; }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft --title "$GITHUB_REF_NAME" --notes "Notes to come."
